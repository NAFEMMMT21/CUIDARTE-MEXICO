    <!-- Anti-Zoom & Gesture Lock for Mobile & Touch Devices -->
    <script>
      (function() {
        // 1. Prevent iOS Safari gesture zoom
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        }, { passive: false });

        // 2. Prevent multi-touch pinch-to-zoom on Android Chrome, Safari, Samsung Internet & touch devices
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if ((e.touches && e.touches.length > 1) || (e.scale && e.scale !== 1)) {
            e.preventDefault();
          }
        }, { passive: false });

        // 3. Prevent double-tap zoom on mobile devices while preserving normal taps
        var lastTouchStart = 0;
        document.addEventListener('touchstart', function(e) {
          var now = Date.now();
          if (now - lastTouchStart <= 300) {
            var target = e.target;
            var isTextInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');
            if (!isTextInput) {
              e.preventDefault();
              if (target && typeof target.click === 'function') {
                target.click();
              }
            }
          }
          lastTouchStart = now;
        }, { passive: false });

        // 4. Prevent Ctrl / Meta + Wheel / Pinch on trackpads and desktops
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
          }
        }, { passive: false });

        // 5. Prevent keyboard zoom shortcuts (Ctrl/Meta +/-/0/=)
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
          }
        });
      })();
    </script>
